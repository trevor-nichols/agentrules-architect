name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  import_smoke_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.17"
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -c 'import agentrules; print(agentrules.__file__)'

  prompt_template_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.17"
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q tests/unit/test_prompt_template_validation.py

  parser_corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.17"
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q tests/unit/test_parser_corpus.py tests/unit/test_agent_parser_basic.py

  token_packer_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.17"
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q tests/unit/utils/test_token_packer.py -k packing_counts_each_file_once_for_100_files

  offline_pipeline_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.17"
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q tests/offline/test_pipeline_smoke.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.17"
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -q tests/unit
